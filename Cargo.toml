[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.3"
edition = "2024"
rust-version = "1.95"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
smhub-model = { path = "crates/smhub-model" }
smhub-store = { path = "crates/smhub-store" }
smhub-auth = { path = "crates/smhub-auth" }
smhub-sys = { path = "crates/smhub-sys" }
smhub-api = { path = "crates/smhub-api" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "form"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
bcrypt = { version = "0.17", default-features = false, features = ["std"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
nix = { version = "0.31", default-features = false, features = ["fs", "term", "process", "signal", "socket", "user", "ioctl", "net", "uio"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde-saphyr = "1"
bytes = "1"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
spidev = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
collapsible_if = "allow"
collapsible_match = "allow"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
debug = false
